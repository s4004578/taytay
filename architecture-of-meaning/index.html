<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture of Meaning — Graph</title><style>*{box-sizing:border-box}body{margin:0;background:#070c13;color:#e4f8ff;font:13px system-ui}header{height:56px;padding:12px 18px;background:#0b141e;border-bottom:1px solid #234;display:flex;justify-content:space-between}h1{font-size:16px;margin:0}small{color:#8ab}main{display:grid;grid-template-columns:220px 1fr 280px;height:calc(100vh - 56px)}aside{background:#0b131e;padding:16px;overflow:auto;border-right:1px solid #234}aside:last-child{border-left:1px solid #234}#stage{position:relative;overflow:hidden;background:radial-gradient(ellipse,#102a38,#060b11 70%)}svg{width:100%;height:100%;touch-action:none}button,input{background:#142432;color:#dffaff;border:1px solid #345;border-radius:6px;padding:8px;cursor:pointer}input{width:100%}button:hover{border-color:#36dfea}.item{display:block;width:100%;text-align:left;margin:5px 0}.bar{position:absolute;top:10px;left:10px;display:flex;gap:5px}.stat{position:absolute;bottom:10px;left:10px;background:#07121bdd;padding:9px;border:1px solid #234}.edge{stroke:#3ee7f5;stroke-opacity:.18;stroke-width:1;cursor:pointer}.edge.active{stroke-opacity:.95;stroke-width:2}.node{cursor:pointer}.node circle{fill:#39e4f5;stroke:#bbffff;filter:drop-shadow(0 0 5px #13d8ec)}.node text{fill:#d5faff;font-size:10px;paint-order:stroke;stroke:#06111b;stroke-width:3px;pointer-events:none}.dim{opacity:.12}.kv{padding:9px 0;border-bottom:1px solid #234;overflow-wrap:anywhere}.kv b{display:block;color:#7db4c7;font-size:11px}.good{color:#7eebc2}@media(max-width:850px){main{grid-template-columns:150px 1fr}aside:last-child{position:absolute;right:0;top:56px;bottom:0;width:280px;z-index:5;display:none}aside:last-child.open{display:block}}@media(max-width:520px){main{display:block}aside:first-child{display:none}#stage{height:calc(100vh - 56px)}}</style><header><div><h1>◈ The Architecture of Meaning</h1><small>Stage 01 · Canonical Research Atlas</small></div><span id="count">Loading…</span></header><main><aside><h3>Project Explorer</h3><input id="search" placeholder="Search concepts"><h3>Graph Views</h3><button class="item" id="all">Full network</button><button class="item" id="axis">Five axes</button><button class="item" id="problem">Problem edges</button><h3>Clusters</h3><div id="clusters"></div><h3>Audit</h3><div id="audit"></div></aside><section id="stage"><svg id="graph"></svg><div class="bar"><button id="reset">Reset</button><button id="plus">+</button><button id="minus">−</button><button id="export">Export JSON</button><button id="inspect">Inspector</button></div><div class="stat" id="stats">Loading…</div></section><aside id="right"><h3>Research inspector</h3><div id="details">Select a node or edge to inspect its metadata.</div><h3>Connected nodes</h3><div id="neighbors"></div></aside></main><script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script><script>
const $=id=>document.getElementById(id),txt=v=>String(v??''),esc=s=>txt(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),id=v=>typeof v==='object'?v.id:v;
let graph,nodes,edges,svg,root,zoom,sim,filter='all',cluster='all',query='',focus=null;
function detail(o){$('right').classList.add('open');focus=o;const node=!!o.cluster;const fields=node?['id','label','cluster','description','status','source','research_note']:['id','type','rationale','confidence','evidence_required','source_citation','original_source_label','original_target_label'];$('details').innerHTML=(node?'<h3>'+esc(o.label)+'</h3>':'<h3>'+esc(label(o.source))+' ↔ '+esc(label(o.target))+'</h3>')+fields.map(k=>'<div class="kv"><b>'+esc(k)+'</b>'+esc(o[k])+'</div>').join('');$('neighbors').innerHTML='';if(node)edges.filter(e=>id(e.source)===o.id||id(e.target)===o.id).forEach(e=>{let b=document.createElement('button');b.className='item';b.textContent=label(id(e.source)===o.id?e.target:e.source)+' · '+e.type;b.onclick=()=>detail(e);$('neighbors').append(b)});highlight()}
function label(v){return nodes.find(n=>n.id===id(v))?.label||id(v)}
function highlight(){const f=focus?.cluster?focus.id:null;const near=new Set([f]);if(f)edges.forEach(e=>{if(id(e.source)===f)near.add(id(e.target));if(id(e.target)===f)near.add(id(e.source))});root.selectAll('.node').classed('dim',d=>!!f&&!near.has(d.id));root.selectAll('.edge').classed('dim',d=>!!f&&id(d.source)!==f&&id(d.target)!==f).classed('active',d=>!!f&&(id(d.source)===f||id(d.target)===f))}
function redraw(){const axes=new Set(['Knowledge','Power','Freedom','Consequences','Justice']);const allowed=new Set(nodes.filter(n=>(cluster==='all'||n.cluster===cluster)&&(!query||n.label.toLowerCase().includes(query))&&(filter!=='axis'||axes.has(n.label))).map(n=>n.id));const valid=edges.filter(e=>allowed.has(id(e.source))&&allowed.has(id(e.target))&&(filter!=='problem'||e.type==='PROBLEM'));const shown=new Set(filter==='problem'?valid.flatMap(e=>[id(e.source),id(e.target)]):allowed);root.selectAll('.node').style('display',d=>shown.has(d.id)?null:'none');root.selectAll('.edge').style('display',d=>valid.includes(d)?null:'none');$('stats').textContent=shown.size+' nodes · '+valid.length+' edges · Drag / zoom / select';highlight()}
function load(g){graph=g;nodes=g.nodes.map(x=>({...x}));edges=g.edges.map(x=>({...x}));const ids=new Set(nodes.map(n=>n.id));const missing=edges.filter(e=>!ids.has(e.source)||!ids.has(e.target));$('count').textContent=nodes.length+' nodes / '+edges.length+' edges';$('audit').innerHTML='<span class="good">● Integrity checks</span><p>Missing endpoints: '+missing.length+'<br>Duplicate node IDs: '+(nodes.length-ids.size)+'<br>Duplicate edge IDs: '+(edges.length-new Set(edges.map(e=>e.id)).size)+'</p><small>Evidence is not automatically verified.</small>';const clusters=[...new Set(nodes.map(n=>n.cluster))].sort();['all',...clusters].forEach(c=>{const b=document.createElement('button');b.className='item';b.textContent=c==='all'?'All clusters':c;b.onclick=()=>{cluster=c;redraw()};$('clusters').append(b)});svg=d3.select('#graph');const w=svg.node().clientWidth,h=svg.node().clientHeight;svg.attr('viewBox',[0,0,w,h]);root=svg.append('g');zoom=d3.zoom().scaleExtent([.2,8]).on('zoom',e=>root.attr('transform',e.transform));svg.call(zoom);const link=root.append('g').selectAll('line').data(edges).join('line').attr('class','edge').on('click',(ev,d)=>{ev.stopPropagation();detail(d)});const n=root.append('g').selectAll('g').data(nodes).join('g').attr('class','node').on('click',(ev,d)=>{ev.stopPropagation();detail(d)});n.append('circle').attr('r',d=>['Knowledge','Power','Freedom','Consequences','Justice'].includes(d.label)?8:4.5);n.append('text').attr('x',8).attr('y',-7).text(d=>d.label);sim=d3.forceSimulation(nodes).force('link',d3.forceLink(edges.map(e=>({...e}))).id(d=>d.id).distance(55).strength(.13)).force('charge',d3.forceManyBody().strength(-130)).force('center',d3.forceCenter(w/2,h/2)).force('collide',d3.forceCollide(19)).on('tick',()=>{link.attr('x1',d=>nodes.find(n=>n.id===id(d.source)).x).attr('y1',d=>nodes.find(n=>n.id===id(d.source)).y).attr('x2',d=>nodes.find(n=>n.id===id(d.target)).x).attr('y2',d=>nodes.find(n=>n.id===id(d.target)).y);n.attr('transform',d=>'translate('+d.x+','+d.y+')')});n.call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));redraw()}
$('search').oninput=e=>{query=e.target.value.toLowerCase();redraw()};$('all').onclick=()=>{filter='all';redraw()};$('axis').onclick=()=>{filter='axis';redraw()};$('problem').onclick=()=>{filter='problem';redraw()};$('reset').onclick=()=>svg.transition().call(zoom.transform,d3.zoomIdentity);$('plus').onclick=()=>svg.transition().call(zoom.scaleBy,1.4);$('minus').onclick=()=>svg.transition().call(zoom.scaleBy,.7);$('inspect').onclick=()=>$('right').classList.toggle('open');$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(graph,null,2)],{type:'application/json'}));a.download='canonical_atlas_v2.json';a.click()};fetch('./data/canonical_atlas_v2.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(load).catch(e=>$('stats').textContent='Load error: '+e.message);
</script></html>
